{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signaler une panne - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; font-family: "Inter", sans-serif; }
        .card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-signaler { background: #e74c3c; border-radius: 30px; padding: 12px; font-weight: 600; }
        .btn-signaler:hover { background: #c0392b; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white text-center py-3" style="border-radius: 20px 20px 0 0;">
                        <i class="fas fa-exclamation-triangle fa-2x mb-2"></i>
                        <h4 class="mb-0">Signaler une panne</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-warning">
                            <i class="fas fa-info-circle"></i> Demande #{{ demande.id }}
                        </div>
                        <p><strong>Materiel :</strong> 
                            {% for ligne in demande.lignes.all %}
                                {{ ligne.materiel.nom }}{% if not forloop.last %}, {% endif %}
                            {% endfor %}
                        </p>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">Description de la panne <span class="text-danger">*</span></label>
                                <textarea name="description" class="form-control" rows="5" required 
                                    placeholder="Ex: L'appareil ne s'allume pas, l'ecran est casse..."></textarea>
                                <div class="form-text text-muted">
                                    <i class="fas fa-clock me-1"></i> Un technicien sera informe immediatement.
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-signaler text-white">
                                    <i class="fas fa-paper-plane me-2"></i> Envoyer
                                </button>
                                <a href="{% url 'mes_demandes' %}" class="btn btn-outline-secondary">
                                    <i class="fas fa-arrow-left me-2"></i> Retour
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
