{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #3498db); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 24px; padding: 50px 40px; text-align: center; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .error-code { font-size: 6rem; font-weight: 900; color: #2c3e50; line-height: 1; }
        .error-icon { font-size: 3rem; color: #3498db; margin-bottom: 10px; }
    </style>
<link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body>
    <div class="error-card">
        <div class="error-icon"><i class="fas fa-map-marker-alt"></i></div>
        <div class="error-code">404</div>
        <h4 class="mt-3 text-dark">Page introuvable</h4>
        <p class="text-muted mb-4">La page que vous cherchez n'existe pas ou a ete deplacee.</p>
        <div class="d-flex gap-2 justify-content-center">
            <a href="/" class="btn btn-primary px-4" style="border-radius:25px;background:#2c3e50;border:none">
                <i class="fas fa-home"></i> Accueil
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4" style="border-radius:25px">
                <i class="fas fa-arrow-left"></i> Retour
            </a>
        </div>
    </div>
<script src="{% static 'js/animations.js' %}"></script>
</body>
</html>
