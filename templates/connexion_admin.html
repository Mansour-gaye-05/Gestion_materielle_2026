<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administrateur - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .bg-custom { background-color: #2c3e50 !important; }
        .btn-custom { background-color: #2c3e50 !important; color: white !important; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-custom text-white text-center">
                        <h4><i class="fas fa-shield-alt"></i> Administration</h4>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                        <form method="post" autocomplete="off">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label>Nom d'utilisateur</label>
                                <input type="text" name="username" class="form-control" value="" autocomplete="off" required>
                            </div>
                            <div class="mb-3">
                                <label>Mot de passe</label>
                                <input type="password" name="password" class="form-control" autocomplete="off" required>
                            </div>
                            <button type="submit" class="btn btn-custom w-100">Se connecter</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <small><a href="{% url 'accueil' %}">← Retour à l'accueil</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
