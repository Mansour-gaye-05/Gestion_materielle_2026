<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><title>Gérer utilisateurs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>.bg-custom { background-color: #2c3e50 !important; }</style></head>
<body>
<nav class="navbar navbar-dark bg-custom"><div class="container-fluid"><a class="navbar-brand" href="#">Gérer utilisateurs</a><a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">← Retour</a></div></nav>
<div class="container mt-4">
    <table class="table">
        <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Filière</th><th>Action</th></tr></thead>
        <tbody>{% for u in utilisateurs %}<tr><td>{{ u.username }}</td><td>{{ u.email }}</td><td>{{ u.get_role_display }}</td><td>{{ u.filiere|default:"-" }}</td><td><form method="post" action="{% url 'modifier_role' u.id %}">{% csrf_token %}<select name="role"><option {% if u.role == 'etudiant' %}selected{% endif %}>etudiant</option><option {% if u.role == 'enseignant' %}selected{% endif %}>enseignant</option><option {% if u.role == 'technicien' %}selected{% endif %}>technicien</option><option {% if u.role == 'admin' %}selected{% endif %}>admin</option></select><button class="btn btn-sm btn-primary">Changer rôle</button></form></td></tr>{% endfor %}</tbody>
    </table>
</div></body></html>
