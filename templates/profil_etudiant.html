<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-custom { background-color: #2c3e50 !important; }
        .btn-custom { background-color: #2c3e50 !important; border-color: #2c3e50 !important; color: white !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fas fa-graduation-cap"></i> UFR Sciences</a>
            <div class="d-flex">
                <span class="text-white me-3"><i class="fas fa-user"></i> {{ user.username }}</span>
                <a href="{% url 'espace_etudiant' %}" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-arrow-left"></i> Retour
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-custom text-white text-center">
                        <h5><i class="fas fa-user-circle"></i> Mon profil</h5>
                    </div>
                    <div class="card-body">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %}
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label><i class="fas fa-user"></i> Nom d'utilisateur</label>
                                <input type="text" class="form-control" value="{{ user.username }}" disabled>
                                <small class="text-muted">Le nom d'utilisateur ne peut pas être modifié</small>
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-envelope"></i> Email universitaire</label>
                                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-phone"></i> Téléphone</label>
                                <input type="tel" name="telephone" class="form-control" value="{{ user.telephone|default:'' }}">
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-graduation-cap"></i> Filière</label>
                                <select name="filiere" class="form-select">
                                    <option value="">Sélectionner</option>
                                    <option {% if user.filiere == 'Génie Civil' %}selected{% endif %}>Génie Civil</option>
                                    <option {% if user.filiere == 'Topographie' %}selected{% endif %}>Topographie</option>
                                    <option {% if user.filiere == 'Géomatique' %}selected{% endif %}>Géomatique</option>
                                    <option {% if user.filiere == 'Géotechnique' %}selected{% endif %}>Géotechnique</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label><i class="fas fa-chart-line"></i> Niveau</label>
                                <select name="niveau" class="form-select">
                                    <option value="">Sélectionner</option>
                                    <option {% if user.niveau == 'Licence 1' %}selected{% endif %}>Licence 1</option>
                                    <option {% if user.niveau == 'Licence 2' %}selected{% endif %}>Licence 2</option>
                                    <option {% if user.niveau == 'Licence 3' %}selected{% endif %}>Licence 3</option>
                                    <option {% if user.niveau == 'Master 1' %}selected{% endif %}>Master 1</option>
                                    <option {% if user.niveau == 'Master 2' %}selected{% endif %}>Master 2</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-custom w-100">
                                <i class="fas fa-save"></i> Mettre à jour
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
