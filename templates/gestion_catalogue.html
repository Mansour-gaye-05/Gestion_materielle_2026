<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gérer catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.bg-custom { background-color: #2c3e50 !important; }</style>
</head>
<body>
<nav class="navbar navbar-dark bg-custom">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Gérer le catalogue</a>
        <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm">← Retour</a>
    </div>
</nav>

<div class="container mt-4">
    <h3>Ajouter un matériel</h3>
    <form method="post" action="{% url 'ajouter_materiel' %}" class="row g-2">
        {% csrf_token %}
        <div class="col-md-3"><input name="nom" class="form-control" placeholder="Nom" required></div>
        <div class="col-md-2">
            <select name="categorie" class="form-select">
                <option value="">Catégorie</option>
                {% for cat in categories %}
                    <option value="{{ cat.id }}">{{ cat.libelle }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-2"><input name="numero_serie" class="form-control" placeholder="N° série"></div>
        <div class="col-md-3"><input name="description" class="form-control" placeholder="Description"></div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Ajouter</button></div>
    </form>

    <h3 class="mt-4">Liste des matériels</h3>
    <table class="table table-sm">
        {% for m in materiels %}
        {% if m.id %}
        <tr>
            <td>{{ m.nom }}</td>
            <td>{{ m.categorie.libelle|default:"-" }}</td>
            <td>{{ m.etat }}</td>
            <td>
                <form method="post" action="{% url 'modifier_materiel' m.id %}" style="display:inline">
                    {% csrf_token %}
                    <input name="nom" value="{{ m.nom }}" size="12" class="form-control-sm">
                    <input name="numero_serie" value="{{ m.numero_serie }}" size="8" placeholder="N° série" class="form-control-sm">
                    <input name="description" value="{{ m.description }}" size="15" placeholder="Description" class="form-control-sm">
                    <select name="categorie" class="form-select-sm">
                        <option value="">Catégorie</option>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if m.categorie.id == cat.id %}selected{% endif %}>{{ cat.libelle }}</option>
                        {% endfor %}
                    </select>
                    <select name="etat" class="form-select-sm">
                        <option {% if m.etat == 'disponible' %}selected{% endif %} value="disponible">disponible</option>
                        <option {% if m.etat == 'emprunte' %}selected{% endif %} value="emprunte">emprunte</option>
                        <option {% if m.etat == 'maintenance' %}selected{% endif %} value="maintenance">maintenance</option>
                    </select>
                    <button class="btn btn-sm btn-warning">Modifier</button>
                </form>

                <form method="post" action="{% url 'supprimer_materiel' m.id %}" style="display:inline">
                    {% csrf_token %}
                    <button class="btn btn-sm btn-danger" onclick="return confirm('Supprimer ?')">Supprimer</button>
                </form>
            </td>
        </tr>
        {% endif %}
        {% empty %}
        <tr><td colspan="4" class="text-center text-muted">Aucun matériel</td></tr>
        {% endfor %}
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
