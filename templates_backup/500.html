{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur serveur - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #c0392b, #e74c3c); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-card { background: white; border-radius: 24px; padding: 50px 40px; text-align: center; max-width: 500px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .error-code { font-size: 6rem; font-weight: 900; color: #e74c3c; line-height: 1; }
    </style>
<link rel="stylesheet" href="{% static 'css/animations.css' %}">
</head>
<body>
    <div class="error-card">
        <div style="font-size:3rem;color:#e74c3c;margin-bottom:10px"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="error-code">500</div>
        <h4 class="mt-3 text-dark">Erreur serveur</h4>
        <p class="text-muted mb-4">Une erreur inattendue s'est produite. Notre equipe a ete notifiee.</p>
        <a href="/" class="btn px-4" style="border-radius:25px;background:#e74c3c;color:white;border:none">
            <i class="fas fa-home"></i> Retour a l'accueil
        </a>
    </div>
<script src="{% static 'js/animations.js' %}"></script>
</body>
</html>
