{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administrateur - UFR Sciences</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/animations.css' %}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(231,76,60,0.1) 0%, transparent 70%);
            top: -200px; right: -200px;
            border-radius: 50%;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(44,62,80,0.3) 0%, transparent 70%);
            bottom: -100px; left: -100px;
            border-radius: 50%;
        }
        .login-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.4);
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        .login-logo {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(231,76,60,0.3);
            animation: float 3s ease-in-out infinite;
        }
        .login-logo i { font-size: 1.8rem; color: white; }
        .login-title { font-family: 'Manrope', sans-serif; font-weight: 800; color: white; font-size: 1.6rem; text-align: center; margin-bottom: 6px; }
        .login-subtitle { color: rgba(255,255,255,0.55); font-size: 0.85rem; text-align: center; margin-bottom: 30px; }
        .admin-badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(231,76,60,0.2); border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; padding: 4px 14px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0 auto 24px; display: flex; justify-content: center; width: fit-content; }
        .form-label { color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            color: white;
            padding: 12px 16px;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            border-color: #e74c3c;
            box-shadow: 0 0 0 3px rgba(231,76,60,0.2);
            color: white;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .input-icon { position: relative; }
        .input-icon i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); font-size: 0.85rem; }
        .input-icon .form-control { padding-left: 38px; }
        .btn-login {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none; border-radius: 12px; color: white;
            font-weight: 700; font-size: 0.95rem; padding: 13px;
            width: 100%; transition: all 0.3s; font-family: 'Inter', sans-serif; margin-top: 8px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(231,76,60,0.4); color: white; }
        .alert { border-radius: 12px; font-size: 0.83rem; background: rgba(231,76,60,0.2); border: 1px solid rgba(231,76,60,0.3); color: #e74c3c; }
        .divider { border-color: rgba(255,255,255,0.1); margin: 20px 0; }
        .link-bottom { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.78rem; }
        .link-bottom a { color: rgba(255,255,255,0.6); text-decoration: none; }
        .link-bottom a:hover { color: white; }
        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-logo">
        <i class="fas fa-shield-alt"></i>
    </div>
    <h1 class="login-title">Espace Admin</h1>
    <div class="admin-badge"><i class="fas fa-lock"></i> Acces restreint</div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert mb-3"><i class="fas fa-exclamation-circle me-2"></i>{{ message }}</div>
    {% endfor %}
    {% endif %}

    <form method="post" autocomplete="off">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nom d'utilisateur</label>
            <div class="input-icon">
                <i class="fas fa-user-shield"></i>
                <input type="text" name="username" class="form-control" placeholder="Identifiant administrateur" autocomplete="off" required autofocus>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <div class="input-icon">
                <i class="fas fa-lock"></i>
                <div class="input-group">
                            <input type="password" name="password" class="form-control" placeholder="Mot de passe" autocomplete="off" required>
                            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd(this)" tabindex="-1" style="border-radius:0 8px 8px 0">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="fas fa-sign-in-alt me-2"></i> Acceder au tableau de bord
        </button>
    </form>

    <hr class="divider">
    <p class="link-bottom">
        <a href="{% url 'accueil' %}"><i class="fas fa-arrow-left me-1"></i> Retour a l'accueil</a>
        &nbsp;?&nbsp;
        <a href="{% url 'connexion' %}">Espace etudiant</a>
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/animations.js' %}"></script>
</body>
</html>
