{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Signaler une panne</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: f0f2f5; }
        .card { border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .btn-signaler { background: e74c3c; border-radius: 30px; }
        .btn-signaler:hover { background: c0392b; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header bg-danger text-white text-center py-3">
                        <i class="fas fa-exclamation-triangle fa-2x"></i>
                        <h4>Signaler une panne</h4>
                    </div>
                    <div class="card-body p-4">
                        <p><strong>Matériel :</strong> {% for ligne in demande.lignes.all %}{{ ligne.materiel.nom }}{% endfor %}</p>
                        <form method="post">
                            {% csrf_token %}
                            <textarea name="description" class="form-control" rows="5" required placeholder="Description de la panne..."></textarea>
                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-signaler text-white">Envoyer</button>
                                <a href="{% url 'mes_demandes' %}" class="btn btn-outline-secondary">Retour</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
